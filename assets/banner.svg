<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a1e0"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="pipeline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glassmorphism Card Fill -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulse-glow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -80; }
    }
    .floating-node { animation: float 6s ease-in-out infinite; }
    .floating-node-delayed { animation: float 7s ease-in-out 2s infinite; }
    .glowing-bg { animation: pulse-glow 4s ease-in-out infinite; }
    .animated-line {
      stroke-dasharray: 10 15;
      animation: dash 5s linear infinite;
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="180" fill="#00a1e0" opacity="0.12" filter="url(#glow)" class="glowing-bg"/>
  <circle cx="1050" cy="240" r="200" fill="#a855f7" opacity="0.12" filter="url(#glow)" class="glowing-bg"/>

  <!-- Background Grid Pattern -->
  <g opacity="0.07">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0V320 M200 0V320 M300 0V320 M400 0V320 M500 0V320 M600 0V320 M700 0V320 M800 0V320 M900 0V320 M1000 0V320 M1100 0V320" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Dynamic CI/CD Pipeline Visual Waves (In Background) -->
  <path d="M -50 250 Q 300 120 600 250 T 1250 180" fill="none" stroke="url(#pipeline-grad)" stroke-width="3"/>
  <path d="M -50 250 Q 300 120 600 250 T 1250 180" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" class="animated-line"/>

  <!-- Subtle Dynamic Tech Nodes (In Background) -->
  <g class="floating-node" opacity="0.4">
    <rect x="920" y="45" width="180" height="42" rx="21" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="1010" y="71" text-anchor="middle" class="pill-text">⚡ Delta Deployments</text>
  </g>

  <g class="floating-node-delayed" opacity="0.4">
    <rect x="880" y="235" width="190" height="42" rx="21" fill="url(#card-grad)" stroke="#c084fc" stroke-opacity="0.3"/>
    <text x="975" y="261" text-anchor="middle" class="pill-text">🤖 AI Release Agents</text>
  </g>

  <g class="floating-node" opacity="0.35">
    <rect x="80" y="225" width="170" height="42" rx="21" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.3"/>
    <text x="165" y="251" text-anchor="middle" class="pill-text">📦 Salesforce DX</text>
  </g>

  <!-- Salesforce Cloud Icon Visual Accent -->
  <g transform="translate(85, 45)" opacity="0.85">
    <path d="M30 18 C30 10 38 4 48 6 C54 2 64 2 70 8 C76 4 86 6 90 14 C96 16 100 22 98 28 C102 34 98 42 90 44 C88 44 14 44 12 44 C4 42 0 34 4 26 C8 20 16 18 22 20 C24 16 26 18 30 18 Z" fill="none" stroke="url(#primary-glow)" stroke-width="3" filter="url(#glow)"/>
  </g>

  <!-- Foreground Main Branding & Text Header -->
  <!-- Top Badge -->
  <rect x="360" y="38" width="480" height="30" rx="15" fill="url(#primary-glow)" opacity="0.15"/>
  <rect x="360" y="38" width="480" height="30" rx="15" fill="none" stroke="url(#primary-glow)" stroke-width="1.5"/>
  <text x="600" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" letter-spacing="1.5">OCTOBER 2026 EDITION • SAAS &amp; OPEN-SOURCE ECOSYSTEM</text>

  <!-- Title (Foreground) -->
  <text x="600" y="130" text-anchor="middle" class="title-text" font-size="42" filter="url(#shadow)">
    Awesome Salesforce DevOps &amp; CI/CD
  </text>
  
  <rect x="420" y="148" width="360" height="4" rx="2" fill="url(#primary-glow)"/>

  <!-- Subtitle (Foreground) -->
  <text x="600" y="188" text-anchor="middle" class="subtitle-text" font-size="18" filter="url(#shadow)">
    Curated List of Commercial Platforms, Open-Source CLI Tools &amp; Release Automation
  </text>

  <!-- Ecosystem Feature Highlights -->
  <g transform="translate(600, 245)">
    <!-- Metadata Deployment -->
    <g transform="translate(-320, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚀 Metadata Pipelines</text>
    </g>
    <!-- Scratch Orgs & CLI -->
    <g transform="translate(-100, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛠️ Salesforce CLI &amp; DX</text>
    </g>
    <!-- AI & Automation -->
    <g transform="translate(120, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🤖 Agentforce DevOps</text>
    </g>
    <!-- Code Quality -->
    <g transform="translate(330, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛡️ DevSecOps</text>
    </g>
  </g>

  <!-- Border Accent -->
  <rect x="2" y="2" width="1196" height="316" rx="14" fill="none" stroke="url(#primary-glow)" stroke-width="1.5" opacity="0.4"/>
</svg>
